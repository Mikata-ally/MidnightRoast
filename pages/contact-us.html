<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Nova+Flat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- links --->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Roast</title>
</head>
<body class="contact-page" data-root="../" data-active-page="contact">
    <div data-component="header"></div>

<main>
    <form class="form1">
        <h1>Get in Touch</h1>
        <div class = "container1">
            <div class="box">
                <h2>Fullname</h2>
                <input type = "text" placeholder = "e.g. Juan N. Dela Cruz" required>
            </div>
            <div class="box">
                <h2>Email</h2>
                <input type = "email" placeholder = "example@gmail.com" required>
            </div>
        </div>
        <div class="container2">
            <textarea placeholder="Write us a note..."></textarea>
            <button type= "submit">SEND MESSAGE</button>
        </div>
    </form>

    <section class="sec1">
        <div class="detail-box">
            <div class="container3">
            <h2>Main Building</h2>
            <h3>Office hours: 10am-6pm</h3>
            <p><i class="fa-solid fa-location-dot"></i>Midnight Roast Wine Shop High Street, Bonifacio Global City (BGC), Taguig City, Philippines</p>
            <p><i class="fa-solid fa-envelope"></i>midnightroast@gmail.com</p>
            <p><i class="fa-solid fa-phone"></i>(63+)993-144-9005</p>
            </div>
            <img src="../img/wine.png" alt="wine">
        </div>
    </section>

    <div data-component="footer"></div>
</main>
<div data-component="auth-modal"></div>
<script src="../components/components.js" defer></script>
    <script src="../scripts/index.js" defer></script>
</body>
</html>
